## --- Test markers (step 5.3) -------------------------------------------------------------
## A marker labels tests, e.g. @pytest.mark.db for tests that need PostgreSQL.
## Registering it here (merge into the existing [tool.pytest.ini_options])
## makes a typo in a marker name an error, and lets CI choose:
## `pytest -m "not db"` (fast, no database) or `pytest -m db` (with one).
# [tool.pytest.ini_options]
# markers = ["db: needs a running PostgreSQL (TE_DATABASE_URL)"]

## --- Command-line programs (steps 3.1, 4.2, 6.1) ----------------------------------
## Each line creates a command in the virtual environment / container.
## The value "module:function" is the function that runs.
# [project.scripts]
# te-mcp = "te_platform.mcp_server.app:main"
# te-worker = "te_platform.jobs.worker:main"
# te-platform = "te_platform.cli:main"

