## =============================================================================
## te_platform/pyproject_additions.toml — what to add to ../pyproject.toml
## =============================================================================
## GUIDE STEP   0.3 (mypy setting for the existing code), 1.1 (package),
##              2.3/2.5 (entry points), 2.4 (anyio), 3.1/4.2/6.1 (commands),
##              then each phase
##              adds its dependencies.
## PURPOSE      pyproject.toml is the one file that tells Python tools what this
##              project is: its dependencies, its command-line programs, its
##              tool settings. The real file must keep working for the existing
##              verifier, so additions are collected here and copied over one
##              section at a time, when the matching guide step is reached.
## USED BY      uv (installs dependencies), setuptools (builds the package),
##              ruff / mypy / pytest (read their [tool.*] sections),
##              registry/loader.py (reads the entry points declared below).
## WHY          Keeping the real pyproject.toml untouched until a step is
##              activated means the existing 910 tests never break because of
##              a half-finished scaffold.
## ACTIVATE     For each section: copy the uncommented lines into the SAME
##              section of ../pyproject.toml (merge lists, don't duplicate
##              headers), run `uv lock && uv sync --all-extras`, run the tests.
## =============================================================================

