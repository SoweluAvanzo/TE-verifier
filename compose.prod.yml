## =============================================================================
## compose.prod.yml — PRODUCTION additions to compose.yml
## =============================================================================
## GUIDE STEP   4.5 (web, mcp), then one block per service when compose.yml
##              gets it (5.1, 5.3, 6.1, 8.1, 9.0); used for every deploy
##              from 12.2 on (12.2: migrate tolerates rollbacks; 12.3: Caddy's
##              domain and the public ports).
## PURPOSE      Turns the base stack into the production stack:
##                - every app service runs the image built and scanned by CI,
##                  pulled from GitHub Container Registry, with an exact tag
##                  (the git commit SHA in TE_IMAGE_TAG) — never `latest`;
##                - Caddy too runs the image the release workflow built;
##                - `migrate` tolerates a database that is newer than the
##                  image (rollback, guide 12.2);
##                - services restart after crashes and reboots;
##                - nothing is built on the server, no source bind mounts,
##                  no debug ports, no auto-reload;
##                - ONLY Caddy publishes ports (80, 443, and 443/udp for
##                  HTTP/3; from guide 12.3).
##              Used explicitly, never automatically (docs/operations.md §1):
##                docker compose -f compose.yml -f compose.prod.yml pull
##                docker compose -f compose.yml -f compose.prod.yml run --rm migrate
##                docker compose -f compose.yml -f compose.prod.yml up -d
## USED BY      The production server (docs/operations.md: deploy and rollback),
##              deploy/postgres/backup.sh.
## DEPENDS ON   compose.yml, .env on the server with TE_IMAGE_TAG=<commit sha>
##              (and CADDY_SITE_ADDRESS from 12.3), ./secrets/ on the server,
##              the images pushed by .github/workflows/release.yml.template,
##              and a checkout of the repository at the SAME commit as
##              TE_IMAGE_TAG (this file, compose.yml, deploy/ are read from
##              it; docs/operations.md §0).
## WHY          Guide 12.2: the server never builds code; what runs is exactly
##              the image that passed CI. Rollback = previous tag + same
##              command (which is why `migrate` must tolerate a newer schema).
## ACTIVATE     Uncomment the 4.5 code, then each later block at its step.
##              Check (TE_IMAGE_TAG is set inline until .env has it, 12.2):
##                TE_IMAGE_TAG=test docker compose -f compose.yml -f compose.prod.yml config
##              shows no `build:`, no bind-mounted source, and ports only on caddy.
