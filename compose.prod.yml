## The same image for every app role (D1). ${TE_IMAGE_TAG:?...} makes Compose
## stop with this message if the variable is missing, instead of silently
## pulling an untagged image.
x-prod-app: &prod-app
  image: ghcr.io/soweluavanzo/te-verifier:${TE_IMAGE_TAG:?set TE_IMAGE_TAG to the commit SHA to deploy}
  restart: unless-stopped

services:
  web:
    <<: *prod-app
  mcp:
    <<: *prod-app
##   Guide 5.1
  postgres:
    restart: unless-stopped
##   Guide 5.3
  migrate:
    <<: *prod-app
    # A one-shot job must not be restarted after it finishes.
    restart: "no"
##     Guide 12.2: rollbacks. After a rollback to an older image the
##     database already holds migrations that image does not know, and a
##     plain `upgrade head` fails ("Can't locate revision"): `migrate` would
##     never complete, so mcp, worker and agent (which wait for it) would
##     never start. With skip_if_newer=true, env.py reports the newer
##     revision and exits 0 without changing anything; real migration
##     errors still fail. The older code works on the newer schema because
##     migrations only add (docs/operations.md §1). Development keeps the
##     strict command of compose.yml.
    command: ["alembic", "-c", "te_platform/db/alembic.ini", "-x", "skip_if_newer=true",
              "upgrade", "head"]
##   Guide 6.1
  worker:
    <<: *prod-app
  redis:
    restart: unless-stopped
##   Guide 8.1
  agent:
    <<: *prod-app
##   Guide 9.0: the Caddy image built by the release workflow from
##   deploy/caddy/Dockerfile, with the same tag as the app image. Until
##   12.3 it publishes nothing and serves the Caddyfile's default address.
  caddy:
    image: ghcr.io/soweluavanzo/te-verifier-caddy:${TE_IMAGE_TAG:?set TE_IMAGE_TAG to the commit SHA to deploy}
    restart: unless-stopped
##     Guide 12.3: the public domain and the only published ports.
    environment:
      # Your domain, e.g. te.example.org: Caddy obtains its certificate.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS to your domain}
    # The ONLY published ports of the whole system (guide 12.3 "done when").
    ports:
      - "80:80"        # HTTP: only redirects to HTTPS and answers certificate checks
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
