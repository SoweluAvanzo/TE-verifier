## =============================================================================
## tests/platform_tests/case_study_differences.yaml — what the interview does not reproduce
## =============================================================================
## GUIDE STEP   7.3
## PURPOSE      The case-study replay (test_platform_elicitation.py, guide
##              7.3) answers the elicitation protocol with the values of each
##              examples/*.yaml file and checks that the resulting spec has
##              the example's spec hash. Fields that NO slot of the protocol
##              asks cannot come out of an interview, so the replay lacks
##              them. This file lists every such field, with the reason, so
##              that each difference is a documented decision instead of a
##              silent gap. Anything NOT listed here must be reproduced
##              exactly.
## FORMAT       differences: a mapping from an IR path, in the protocol's
##              notation ("tokens[].transferable" = that field of every
##              token, elicitation/paths.py), to
##                kind    intended: not a design question (free text, a
##                          setting of the analysis, a value the schema
##                          derives from another answer);
##                        gap: an input the verifier reads that the
##                          interview cannot collect yet;
##                reason  why, in one or two sentences, naming who reads
##                        the field.
##              A path covers everything below it ("non_tokenized_assets"
##              = the whole list).
## USED BY      tests/platform_tests/test_platform_elicitation.py (7.3: the
##              replay copies exactly these fields from the example before
##              comparing hashes; every entry must be a difference of at
##              least one example under the complete test protocol).
## DEPENDS ON   examples/*.yaml, schema/te_ir.py, the slots of
##              policy/elicitation_protocol.yaml (and of the test-only
##              _complete_protocol() fixture, which the "needed" check uses).
## WHY          Guide 7.3 "Done when": the replayed spec has the example's
##              hash, or a documented, intended difference. Architecture
##              §4.1: each case study can be reproduced by answering the
##              protocol. The list is data, like the protocol (D16), so a
##              reviewer can read and challenge every entry.
## ACTIVATE     Uncomment together with the 7.3 block of
##              test_platform_elicitation.py. Closing a gap: add the slot to
##              the protocol (and to _complete_protocol()), run the 7.3
##              tests, then delete the entry (the "needed" test says when).
## =============================================================================

