## =============================================================================
## SOLUTION: complete reference data (commented out on purpose)
## =============================================================================

differences:

## --- intended: not design questions ----------------------------------------
  meta.description:
    kind: intended
    reason: >-
      Free text for people reading the file. No failure mode reads it; the
      interview's own summary is the confirmation of Stage 10.
  meta.simulation_horizon:
    kind: intended
    reason: >-
      How many periods the simulators run (verifier/simulate/trajectory.py,
      verifier/sign_validation.py): a choice of the analysis, not a fact
      about the design. The example authors set it so that supply caps
      binding after decades are visible; the platform's simulation tools
      take the horizon as an argument.
  tokens[].holding_incentive_present:
    kind: intended
    reason: >-
      Legacy boolean kept for old YAML files. schema/te_ir.py
      (Token._backcompat_holding_incentives) derives it from
      holding_incentives, which the protocol asks (tokens.holding).

## --- gaps: verifier inputs the interview cannot collect yet ----------------
  tokens[].transferable:
    kind: gap
    reason: >-
      FM1, FM2 and FM3 read it (FM2 skips non-transferable tokens,
      verifier/failure_modes/fm2_velocity.py; verifier/token_role.py), but no
      stage of docs/specification-flow.md asks it and the protocol has no
      yes/no answer type; the schema default (true) holds for most designs.
  governance.vote_weighting:
    kind: gap
    reason: >-
      FM6 adjusts the capture risk by the vote-weighting class
      (verifier/failure_modes/fm6_governance.py). Stage 7 of
      docs/specification-flow.md says "ask for vote weighting" for DAOs,
      but the protocol has no slot for it yet; the default is linear.
  governance.vote_weighting_params:
    kind: gap
    reason: >-
      The parameters of the vote-weighting class above (e.g. cap_fraction,
      avg_lock_fraction); asked together with it once that slot exists.
  non_tokenized_assets:
    kind: gap
    reason: >-
      Goods and services that are not tokens (cascina_roccafranca: the
      basket of goods local merchants accept), read only by the agent-based
      simulation (verifier/abm/engine.py, verifier/abm/flow_graph.py); no
      stage of the specification flow asks for them.
