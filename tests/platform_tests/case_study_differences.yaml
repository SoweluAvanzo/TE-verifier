##
## Guide 7.3
## [ ] 1. A single top-level key `differences:`, a mapping. Start it EMPTY
##        and activate the 7.3 tests: each failing case study names the
##        paths its replay did not reproduce.
## [ ] 2. For each reported path, decide: is a slot missing (add it to the
##        protocol, guide 7.2), or is the field not something an interview
##        should ask? Only then add an entry:
##          | meta.description:
##          |   kind: intended
##          |   reason: Free text for people; no failure mode reads it.
##        Use the most general path ("tokens[].x", not one token's index).
## [ ] 3. A verifier input that no stage of docs/specification-flow.md
##        collects yet is a `gap`: say which code reads it, so the entry
##        records what the interview misses.
## [ ] 4. Check:
##          | uv run pytest tests/platform_tests/test_platform_elicitation.py -k case_study -v
##        test_every_documented_difference_is_needed fails for an entry no
