## Build the image locally instead of pulling it. Every app service gets the
## same build (same tag te-platform:local from compose.yml), so Docker's build
## cache makes the second and later builds instant. Two reasons it is on every
## service and not only on `web`: `docker compose watch` refuses a `rebuild`
## rule on a service without `build:`, and it copies files with the Docker
## API, which fails on a read-only container ("container rootfs is marked
## read-only"), hence read_only: false in development only.
x-dev-app: &dev-app
  build:
    context: .
    dockerfile: Dockerfile.platform
  read_only: false

services:
  web:
    <<: *dev-app
    # Flask's development server with auto-reload instead of gunicorn.
    # NEVER use this command in production (unhardened, debug features).
    command: ["flask", "--app", "webapp.app", "run", "--host", "0.0.0.0", "--port", "8000",
              "--debug"]
    # 127.0.0.1:5001 on your machine -> 8000 in the container.
    # (5001 because macOS uses 5000 for AirPlay; see README.)
    ports: ["127.0.0.1:5001:8000"]
    # Compose Watch: on save, copy changed files into the running container
    # ("sync"); on dependency changes, rebuild the image ("rebuild"). The
    # image installs the project in editable mode, so the copied files are
    # the ones Python imports.
    develop:
      watch:
        - {action: sync, path: ./webapp, target: /app/webapp}
        - {action: sync, path: ./te_platform, target: /app/te_platform}
        - {action: sync, path: ./verifier, target: /app/verifier}
        - {action: sync, path: ./schema, target: /app/schema}
        - {action: rebuild, path: ./uv.lock}

  mcp:
    <<: *dev-app
    ports: ["127.0.0.1:8001:8000"]
    develop:
      watch:
        - {action: sync+restart, path: ./te_platform, target: /app/te_platform}
        - {action: sync+restart, path: ./policy, target: /app/policy}
        - {action: rebuild, path: ./uv.lock}

##   Guide 5.1: debug port for the database. `postgres` is only on the
##   internal backend network, where published ports are unreachable from
##   your machine (and giving postgres a second, non-internal network would
##   also give it a route to the internet). This forwarder is on both
##   networks, publishes on 127.0.0.1 only, and starts only with
##   `--profile debug` (or when named: `docker compose up -d postgres-port`).
##   For a psql shell no port is needed:
##     docker compose exec postgres psql -U te_admin -d te
  postgres-port:
    image: alpine/socat:1.8.1.1
    profiles: [debug]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    networks: [edge, backend]
    ports: ["127.0.0.1:5432:5432"]
    depends_on:
      postgres: {condition: service_healthy}

##   Guide 5.3: the migration image must contain your newest migrations.
  migrate:
    <<: *dev-app

##   Guide 6.1: the worker has no auto-reload; restart it on changes.
  worker:
    <<: *dev-app
    develop:
      watch:
        - {action: sync+restart, path: ./te_platform, target: /app/te_platform}
        - {action: sync+restart, path: ./verifier, target: /app/verifier}
        - {action: rebuild, path: ./uv.lock}

##   Guide 6.1: debug port for Redis, same forwarder as postgres-port.
##   Without a port: docker compose exec redis redis-cli
  redis-port:
    image: alpine/socat:1.8.1.1
    profiles: [debug]
    command: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:redis:6379"]
    networks: [edge, backend]
    ports: ["127.0.0.1:6379:6379"]
    depends_on:
      redis: {condition: service_healthy}

##   Guide 8.1: uvicorn --reload restarts the agent when a file changes.
  agent:
    <<: *dev-app
    command: ["uvicorn", "te_platform.agent.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload"]
    ports: ["127.0.0.1:8002:8000"]
    develop:
      watch:
        - {action: sync, path: ./te_platform, target: /app/te_platform}
        - {action: rebuild, path: ./uv.lock}

##   Guide 9.0: Caddy in development, plain HTTP on localhost:8080: the
##   one address where the pages (web) and /agent/* (agent) share an origin,
##   so login.js and chat.js reach the agent and the login cookie works
##   (TE_PUBLIC_ORIGIN's default is this address). The Caddyfile reads its
##   site address from CADDY_SITE_ADDRESS; "http://" turns automatic HTTPS
##   off, so no certificate is requested.
  caddy:
    build: ./deploy/caddy
    environment:
      CADDY_SITE_ADDRESS: http://localhost
    ports: ["127.0.0.1:8080:80"]
