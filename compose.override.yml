## Guide 9.0
## [ ] 11. `caddy`: build ./deploy/caddy, ports ["127.0.0.1:8080:80"] and
##        environment CADDY_SITE_ADDRESS: http://localhost (plain HTTP on
##        your machine; the Caddyfile reads it). From now on open the app
##        at http://localhost:8080 (the login and chat pages need it: their
##        scripts call /agent/... on the page's own address). 5001 and
##        8002 stay for debugging one service alone.
## [ ] 12. Check after each block: `docker compose config -q`.
