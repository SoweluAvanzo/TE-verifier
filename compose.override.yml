## Guide 4.5
## [ ] 1. The anchor `x-dev-app: &dev-app` with a `build:` (context .,
##        dockerfile Dockerfile.platform) and read_only: false. Every app service gets
##        it: `docker compose watch` can rebuild only a service that has a
##        build: section, and can copy files only into a writable container.
## [ ] 2. `services:` and `web`: `<<: *dev-app`, the `flask ... run --debug`
##        command on 0.0.0.0:8000, ports ["127.0.0.1:5001:8000"], and a
##        `develop.watch` list: `sync` for ./webapp, ./te_platform,
##        ./verifier, ./schema into /app/..., `rebuild` when ./uv.lock
##        changes:
##          | develop:
##          |   watch:
##          |     - {action: sync, path: ./webapp, target: /app/webapp}
## [ ] 3. `mcp`: `<<: *dev-app`, ports ["127.0.0.1:8001:8000"] and a watch
##        list with `sync+restart` for ./te_platform and ./policy, `rebuild`
##        on uv.lock (the MCP server has no auto-reload, so it must be
##        restarted).
## [ ] 4. Check: `docker compose config` shows the build: sections and only
##        127.0.0.1 ports; `docker compose watch` reloads on save.
##
## Guide 5.1
## [ ] 5. `postgres-port`, a debug port for psql on your machine. Publishing
##        a port of `postgres` itself does NOT work: it is only on the
##        internal backend network. So a tiny forwarder (alpine/socat) sits
##        on backend and edge and publishes 127.0.0.1:5432, only when asked
##        for (profiles: [debug]). For a shell inside the database, no port
##        is needed: `docker compose exec postgres psql -U te_admin -d te`.
## [ ] 6. Check: `docker compose --profile debug up -d`, then
##        `psql -h 127.0.0.1 -U te_app -d te` on your machine.
##
## Guide 5.3, 6.1, 8.1 (one block per service, when compose.yml has it)
## [ ] 7. `migrate` (5.3): `<<: *dev-app` (it runs your new migrations).
## [ ] 8. `worker` (6.1): `<<: *dev-app`, `sync+restart` for ./te_platform
##        and ./verifier, `rebuild` on uv.lock.
## [ ] 9. `redis-port` (6.1): the same forwarder for 127.0.0.1:6379
##        (redis-cli without a port: `docker compose exec redis redis-cli`).
## [ ] 10. `agent` (8.1): `<<: *dev-app`, the uvicorn command with --reload,
##        ports ["127.0.0.1:8002:8000"], sync of ./te_platform, `rebuild`
