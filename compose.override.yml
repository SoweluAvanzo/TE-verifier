## =============================================================================
## compose.override.yml — DEVELOPMENT additions to compose.yml
## =============================================================================
## GUIDE STEP   4.5 (web, mcp), then one block per service when compose.yml
##              gets it: 5.1 postgres-port, 5.3 migrate, 6.1 worker +
##              redis-port, 8.1 agent, 9.0 caddy.
## PURPOSE      `docker compose up` automatically merges this file on top of
##              compose.yml (that is a built-in Compose rule for the name
##              "compose.override.yml"). It turns the base stack into a
##              development stack:
##                - images are BUILT from your working copy (Dockerfile.platform);
##                - `develop.watch` copies your edits into the running
##                  containers on save (`docker compose watch`), instead of
##                  bind-mounting the source;
##                - ports are published on 127.0.0.1 only, so you can open the
##                  apps in your browser without exposing them to your network;
##                - Flask/uvicorn run with auto-reload.
##              Production never loads this file: there you name the files
##              explicitly (-f compose.yml -f compose.prod.yml).
## USED BY      Developers on their own machine.
## DEPENDS ON   compose.yml (the services it extends), Dockerfile.platform,
##              deploy/caddy/Dockerfile (9.0).
## WHY          Architecture D13 / guide 4.5: one base description, with the
##              differences between environments visible in one small file.
## NOTE         A block here for a service that compose.yml does not have yet
##              is an error, so each block is activated at the step of its
##              service (the `## Guide X.Y` line above it).
## ACTIVATE     Uncomment the 4.5 code (commented once), then each later block
##              (commented twice) at its step. Check: `docker compose config`
##              shows the build: sections and only 127.0.0.1 ports.
## =============================================================================

