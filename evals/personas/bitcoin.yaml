## [ ] 2. `background`: a folded text (`>`) of two or three sentences: what
##        they are strong in, how they see the token, what they never
##        formalised.
## [ ] 3. `communication_style`: a folded text on how they answer (short and
##        technical about the protocol, not about economics).
## [ ] 4. `knows_well`: a list of the facts they can state firmly (issuance
##        schedule, informal off-chain governance, no holding incentive,
##        fees paid to miners, so no burn).
## [ ] 5. `unsure_about`: a list of what they do NOT know (holding time,
##        early participant count, transaction volume growth), with a
##        comment saying the verifier must sweep these. This list is the
##        important part: the interviewer must cope with "I don't know".
## [ ] 6. `goals`: a folded text with what the design is for.
