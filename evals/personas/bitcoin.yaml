## GUIDE STEP   13.1
## PURPOSE      Describes the imaginary person the SimulatedDesigner plays when
##              the hidden spec is examples/bitcoin.yaml: who they are, what
##              they know well, and what they are UNSURE about. Uncertainty is
##              essential: a real designer does not know every number, and the
##              interviewer must handle "I don't know" (sweeps) correctly.
## USED BY      evals/simulated_designer.py (loaded and placed in the
##              designer's system prompt), evals/run.py (one case per persona
##              file; the file name must equal the example's name).
## HIDDEN SPEC  examples/bitcoin.yaml. The interviewer never sees it.
## WHY          Guide 13.1: personas reviewed by a co-author with domain
##              knowledge make the simulated interviews realistic.
## ACTIVATE     Uncomment, have a co-author review it, then write one persona
##              per file in examples/ with the same fields.
