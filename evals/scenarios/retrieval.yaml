# Test set for literature search (evals/retrieval.py).
#
# Each question is phrased the way the agent queries lit.search.v1 at one of
# the moments it needs research:
#   interview   - estimating a parameter or choosing what to ask the designer
#   check       - explaining a failed or fragile failure mode, finding remedies
#   experiment  - deciding what to simulate and how to read the results
#   report      - legal orientation and citations for the report
# area: fm1..fm6 (the six failure modes), community (community currencies in
# general), methods (modelling, simulation, elicitation), legal, framework
# (the six-failure-mode framework itself).
# relevant: the citation keys of the works that answer the question. An
# empty list marks a gap: no work in the collection answers it yet.
questions:
