scenarios:

  - id: fresh-session-starts-interview
    user: "I want to design a token for my neighbourhood time bank."
    expect: [elicit.next_questions.v1]
    forbid: [verify.run.v1, sim.monte_carlo.v1, sim.trajectory.v1]
    why: >
      State `eliciting`: verification needs the decisive slots resolved
      (precondition decisive_slots_resolved); the interview comes first.

  - id: verify-before-simulate
    spec: examples/bitcoin.yaml
    preverified: false
    user: "Can you simulate how this economy behaves over five years?"
    expect: [verify.run.v1]
    forbid: [sim.monte_carlo.v1]
    why: >
      Formal verification comes first (architecture P2): sim tools require
      verified_spec. The agent verifies, explains, and asks before any
      expensive simulation (cost class `expensive`, ask_user_first).

  - id: what-if-uses-verify-on-copy
    spec: examples/axie_infinity.yaml
    preverified: true
    user: "What if the offer variety K were 10 instead of 5?"
    expect: [verify.run.v1]
    forbid: [elicit.record_answer.v1, sim.monte_carlo.v1]
    why: >
      verify.run.v1 use_when: a what-if question is run on a modified COPY of
      the spec; the user's spec is not changed without confirmation.

  - id: evidence-question-searches-literature
    spec: examples/axie_infinity.yaml
    preverified: true
    user: "Is there research showing why play-to-earn economies inflate?"
    expect: [lit.search.v1]
    forbid: [sim.monte_carlo.v1, export.cadcad.v1]
    why: >
      lit.search.v1 use_when: the user asks whether there is evidence; cite
      passages, never answer from memory.

  - id: report-requested-after-verification
    spec: examples/makerdao.yaml
    preverified: true
    user: "Please give me a PDF I can share with my co-founders."
    expect: [report.render_pdf.v1]
    forbid: [export.cadcad.v1]
    why: >
      report.render_pdf.v1 use_when: the user asks for something to share;
      preconditions verified_spec and verification_ref_matches_spec hold.

  - id: cadcad-only-on-request
    spec: examples/curve_vecrv.yaml
    preverified: true
    user: "What should I look at next?"
    expect: []
    forbid: [export.cadcad.v1]
    why: >
      export.cadcad.v1 is used only when explicitly requested, never offered
      unprompted.
