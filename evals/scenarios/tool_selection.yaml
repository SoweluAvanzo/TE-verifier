## =============================================================================
## evals/scenarios/tool_selection.yaml — does the agent choose tools as the policy says?
## =============================================================================
## GUIDE STEP   13.3
## PURPOSE      Each scenario prepares a situation (a session with or without a
##              spec, verified or not), sends ONE user message to the agent,
##              and records the tools it calls in that turn. A scenario passes
##              when:
##                - every tool in `expect` was called, in that order (other
##                  calls may be interleaved), and
##                - no tool in `forbid` was called.
##              The expectations restate policy/tool_policy.yaml (use_when,
##              do_not_use_when, preconditions, suggested_next). If the policy
##              changes, update these scenarios in the same pull request.
## USED BY      evals/run.py (run_scenarios).
## FIELDS       id         unique name
##              spec       example file to load as the session's spec (optional)
##              preverified  true = verify.run.v1 already ran on that spec
##              user       the user's message
##              expect     tool ids, in order
##              forbid     tool ids that must not be called
##              why        the policy rule being tested
## WHY          Architecture §3.9 / guide 13.3: tool choice is tested like any
##              other behaviour; every new tool adds at least three scenarios.
## ACTIVATE     Uncomment with run.py. Note: examples/bitcoin.yaml carries
##              error-level coherence issues on purpose (they ARE findings);
##              coherence issues do not block verification.
## =============================================================================

