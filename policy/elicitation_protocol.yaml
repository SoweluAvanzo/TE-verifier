##          | uv run pytest tests/platform_tests/test_platform_elicitation.py -q
##          | uv run pytest tests/platform_tests/test_platform_elicitation.py
##          |   -k parameter_is_asked --runxfail
##        A variable counts as asked when ALWAYS-applying slots fill the IR
