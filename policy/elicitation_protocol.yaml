## =============================================================================
## policy/elicitation_protocol.yaml — the interview rules (WHAT to ask)
## =============================================================================
## GUIDE STEP   7.1 (schema), 7.2 (stages and slots); 7.3 replays the case
##              studies through it (tests only, nothing to add here)
## PURPOSE      The normative list of everything the interview must collect,
##              grouped in stages, with where each answer goes in the TE-IR and
##              which failure modes need it. HOW to ask (one question at a
##              time, ranges not points, no anchoring, ...) is NOT here: it is
##              in te_platform/agent/prompts/interview.md.
## USED BY      te_platform/elicitation/protocol.py (load_protocol validates
##              this file; any unknown key is an error), elicitation/ranking.py
##              (what to ask next), elicitation/answers.py (where answers go,
##              in which shape), elicitation/coverage.py + tests (proof that
##              nothing the six failure modes need is missing),
##              mcp_server/resources.py (published as te://protocol/elicitation,
##              so every MCP client interviews the same way),
##              tests/platform_tests/test_platform_elicitation.py (7.3: every
##              examples/*.yaml is reproduced by answering this protocol).
## SOURCES      Stage structure: docs/specification-flow.md (stages 0-11).
##              Field paths: schema/te_ir.py. "Why we ask" text:
##              verifier/paper.py (referenced by key, never copied). Answer
##              types and the meaning of "unknown": the header of
##              te_platform/elicitation/protocol.py.
## OUT OF SCOPE Stages 0 (orientation), 10 (confirmation) and 11 (verdict
##              presentation) of the specification flow are agent behaviour
##              (te_platform/agent/prompts/interview.md), not slots.
##              Stage 6 (external signals: a signal's range, worst-case rate
##              of change, oracle latency, stale-feed behaviour) has NO field
##              in the TE-IR (the flow calls ExternalSignal a new IR
##              construct), so the verifier could not use its answers: it is
##              not part of the protocol until the schema gains the field.
##              Designs it concerns (stablecoins, tokens anchored "pegged" or
##              "market_price") are detected by the routing rule
##              pegged_or_external_anchor (elicitation/routing.py), which will
##              gate Stage 6 then.
## WHY          Architecture §4.1 and D16: rules as data that co-authors can
##              review and code can test.
## ACTIVATE     Active, with every stage of guide 7.2 (the scaffold had
##              stages 1 and 8 only). To rebuild it yourself, follow the TO-DO
##              below in the order of guide 7.2, running the coverage tests
##              after each stage.
## =============================================================================

## -----------------------------------------------------------------------------
## TO-DO LIST: build this file yourself, step by step
## -----------------------------------------------------------------------------
## Write your data between this list and the SOLUTION marker below. Do the
## steps in order and run each "Check" before moving on. Lines starting with
## "|" are short illustrations, not the full data. Slot ids are referenced
## by routing.py and by recorded answers: once used, never rename them.
## Activate te_platform/elicitation/protocol.py first (it validates this
## file; any unknown key is an error).
##
## Guide 7.1
## [ ] 1. Top-level keys `protocol` (name) and `version` (e.g. 0.1.0), then
##        `stages:` as a list. Check: test_real_protocol_loads passes.
##
## Guide 7.2 (the SOLUTION has every stage; stages 1 and 8 were the original
## skeleton, the others follow the steps below)
## [ ] 2. Stage 1 (S1_archetype, order 1): meta.name (text, bookkeeping:
##        Meta.name is required by the schema) and the decisive enum slot
##        meta.archetype; its choices must equal schema/te_ir.py Archetype.
## [ ] 3. Stage 8 (S8_participants, order 8): N, d, topology and the
##        network degree (applies_when: network_topology). Every slot needs
##        id, ir_path, criticality, answer_type, intent, why_we_ask; a slot
##        that allows unknown also needs unknown_range or unknown_value.
##        Copy their shape for every new slot:
##          | - id: participants.Q
##          |   ir_path: participants.expected_Q
##          |   feeds: [FM1]
## [ ] 4. Stage 2 (S2_tokens, order 2). First the token names, a `list`
##        slot that creates the tokens (the TE-IR has no token-count field:
##        the count is the length of `tokens`):
##          | - id: tokens.ids        # routing.py's multi_token reads it
##          |   ir_path: tokens[].id
##          |   answer_type: list
##          |   allow_unknown: false
##        Then, per token (paths "tokens[]...", asked once per token):
##        tokens.function (enum with the TokenFunction values: written as a
##        list, multi-select), tokens.value_anchor (enum ValueAnchor; slot id
##        read by pegged_or_external_anchor), and Group 1.2, 1.4-1.6 of
##        docs/elicitation-mapping.md: earning_mechanisms,
##        holding_incentives, contribution_verification and
##        redemption_mechanism (the last two have an "unspecified" member,
##        the natural unknown_value).
## [ ] 5. Back to Stage 8, Q8.2-Q8.5 and mapping Group 5: offer variety K
##        (tokens[].offer_variety_K, per token, range, FM4/FM5),
##        participants.expected_Q (range, FM1), participants.growth_g (FM3:
##        an AsymptoticClass object, so a `table` slot; "unknown" is e.g.
##          | unknown_value: {family: unspecified, parameter_ranges:
##          |                 {value: {min: -0.5, max: 1.0}}}
##        so the sweep includes decline) and participants.agent_types (FM2,
##        FM4: holding time, balance share, role and fraction of each agent
##        type, one `table` slot).
## [ ] 6. Stage 7 (S7_governance, order 7), Q7.1-Q7.4 and mapping Group 4:
##        governance.type (enum GovernanceType, FM6), governance.
##        rule_structure (table, FM6: Γ), governance.
##        monitoring_capacity_gamma (range inside [0, 1], FM4: γ), governance.
##        sanction_structure (table, FM4: S), governance.token_balance_gini
##        (range, FM6 secondary signal). Check after stages 1, 2, 7, 8:
##          | uv run pytest tests/platform_tests/test_platform_elicitation.py -q
## [ ] 7. Stage 3 (order 3) per token: tokens[].emission_rules (FM1, FM3,
##        decisive; dsl_expression, translated by the LLM, CLAUDE.md 2.2;
##        "unknown" = a rule whose asymptotic class is "unspecified") and
##        tokens[].initial_distribution (Q3.4, table). Event-catalog
##        triggers also need the top-level `events` (a table slot).
## [ ] 8. Stage 4 (order 4) per token: tokens[].burn_rules (FM1, FM3).
## [ ] 9. Stage 5 (order 5, applies_when: multi_token): cross_token_flows.
## [ ] 10. Stage 6 is out of scope (header, OUT OF SCOPE): no slots.
## [ ] 11. Stage 9 (order 9): the seven NFRs under meta.nfrs (why_we_ask:
##        FM2 for circulation_speed, FM6 for governance_maturity). Enum
##        values must match CirculationSpeed and GovernanceMaturity. The
##        1-5 ratings are ints: a `number` slot per rating writes an int
##        (answers.py). One slot per declaration (not one `table` slot), so
##        each estimate is a separate form question.
## [ ] 12. Rules for every new slot: why_we_ask is a key of verifier/paper.py
##        ALL_CONDITIONS (FM1..FM6), never copied text; every applies_when
##        name must exist in elicitation/routing.py and read only EARLIER
