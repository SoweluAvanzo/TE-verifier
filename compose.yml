## =============================================================================
## compose.yml — the BASE description of the whole platform (all environments)
## =============================================================================
## GUIDE STEP   4.4 (web, mcp), 4.6 (networks), then each phase adds its
##              part: 5.1 postgres, 5.3 migrate, 5.4 mcp -> database, 6.1
##              redis + worker, 8.1 agent, 8.5 agent -> database and keys,
##              9.0 caddy (the single development address of the chat),
##              10.3 report storage and signing key, 12.3 the agent trusts
##              Caddy's forwarded client address.
## PURPOSE      Docker Compose reads this file and starts the platform's
##              containers ("services"), the virtual networks that connect them,
##              the volumes that keep data, and the secrets they receive.
##              This BASE file holds what is the same everywhere. Two small
##              files are merged on top of it:
##                compose.override.yml  development (loaded AUTOMATICALLY by
##                                      `docker compose up`);
##                compose.prod.yml      production (loaded explicitly:
##                                      docker compose -f compose.yml -f compose.prod.yml ...).
## USED BY      Developers (`docker compose up`), the server (guide 12.2),
##              end-to-end tests (guide §2.1), deploy/postgres/backup.sh.
## DEPENDS ON   Dockerfile.platform (the image), .env (non-secret variables;
##              copy .env.example), deploy/postgres/10-init-roles.sh and
##              init-roles.sql (5.1), deploy/caddy/* (9.0), secret files in
##              ./secrets/ (git-ignored; from 5.1: passwords, database URLs
##              and keys are never in .env, see "Secrets" at the end).
## WHY          Architecture D13: one file describes the system; environments
##              differ only in a small override file. D1: every app service
##              runs the SAME image with a different `command:`.
## RELATION TO infra/compose.yml
##              infra/compose.yml is the current demo deployment (one public
##              web container on port 8888). It stays untouched until this
##              stack replaces it in production (guide 12.2); then delete it.
## ACTIVATE     Uncomment the 4.4 code (the lines commented once), then each
##              later block (commented twice, under a `## Guide X.Y` line)
##              when you reach its step. Check after each step:
##                docker compose config -q   (no output = valid; it merges
##                                            compose.override.yml too)
##                docker compose up
##              The image is built by compose.override.yml (4.5); at 4.4,
##              build it first: docker build -f Dockerfile.platform -t te-platform:local .
##              While everything here is commented, `docker compose` reports
##              "empty compose file": that is expected.
## =============================================================================

