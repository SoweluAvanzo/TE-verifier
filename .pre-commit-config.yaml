##
## Guide 0.4
## [ ] 1. `repos:` with the pre-commit/pre-commit-hooks repository at rev
##        v6.0.0 and the hooks end-of-file-fixer, trailing-whitespace,
##        check-yaml and detect-private-key. check-yaml WITHOUT args:
##        --allow-multiple-documents is only for files with several `---`
##        documents, and the repository has none (anchors and `<<` merge
##        keys are normal YAML).
## [ ] 2. The astral-sh/ruff-pre-commit repository, with `rev` equal to the
##        ruff version locked in uv.lock (find it with
##        `grep -A1 'name = "ruff"' uv.lock`), so the hook and CI agree:
##          | rev: v0.17.1
##          | hooks:
##          |   - id: ruff-check
##        `ruff-check` takes args [--fix]; then add the hook `ruff-format`.
## [ ] 3. No mypy hook: mypy needs the installed dependencies, which
##        pre-commit's isolated environments do not have; CI runs it
##        (`uv run mypy te_platform`, ci.yml.template).
## [ ] 4. Check:
##          | uv run pre-commit validate-config
##          | uv run pre-commit install
##          | uv run pre-commit run --all-files
##        The first run fixes files and reports "Failed"; run it again until
##        everything passes. Then a commit with a lint error is blocked.
##
## Guide 2.1
## [ ] 5. A `repo: local` hook policy-consistency that runs pytest on
##        tests/platform_tests/test_platform_policy.py when files under
##        policy/ or te_platform/registry/ change. Not earlier: before that
##        test file is active (2.1), pytest collects no tests and exits with
##        code 5, which pre-commit counts as a failure.
## [ ] 6. Check: change policy/tool_policy.yaml, `git commit` runs the hook.
##
## Stuck, or want to compare? The SOLUTION below is the complete reference
## file. Uncomment it only if you decide to use it as it is.

