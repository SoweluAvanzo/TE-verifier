## =============================================================================
## .pre-commit-config.yaml — checks that run before every `git commit`
## =============================================================================
## GUIDE STEP   0.4 (file hygiene, ruff), 2.1 (policy consistency hook)
## PURPOSE      pre-commit installs these "hooks" into git: before each commit
##              they run on the files you changed, fix what they can (formatting,
##              trailing spaces) and block the commit when something is wrong
##              (lint error, invalid YAML, a private key about to be committed,
##              an inconsistent tool policy).
## USED BY      git (after `uv run pre-commit install`, once per clone).
## DEPENDS ON   pre-commit (dev extra in pyproject.toml), the ruff version
##              locked in uv.lock (the hook's `rev` must match it),
##              tests/platform_tests/test_platform_policy.py (local hook, 2.1).
## WHY          Guide §2.1: problems are caught on your machine in seconds,
##              before CI spends minutes on them; nobody has to remember.
## ACTIVATE     Uncomment the 0.4 code (commented once), then:
##                uv run pre-commit install
##                uv run pre-commit run --all-files   # first run on everything
##              Done when (guide 0.4): a commit with a lint error is blocked.
##              At 2.1, uncomment the policy-consistency hook (commented twice).
##              `uv run pre-commit validate-config` checks this file's syntax.
##              While this file is fully commented, pre-commit would report an
##              empty configuration; do not run `pre-commit install` before.
## =============================================================================

