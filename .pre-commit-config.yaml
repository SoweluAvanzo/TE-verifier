## SOLUTION: complete reference code (commented out on purpose)
## =============================================================================

repos:
  # Generic file hygiene hooks maintained by the pre-commit project.
  # `rev` pins the version; `uv run pre-commit autoupdate` bumps it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer      # every file ends with exactly one newline
      - id: trailing-whitespace    # remove invisible spaces at line ends
      - id: check-yaml             # every YAML file parses
      - id: detect-private-key     # block committing private keys

  # ruff: lint (with safe automatic fixes) and format, same rules as CI.
  # rev = the ruff version in uv.lock, so the hook and CI agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # No mypy hook on purpose: mypy needs the project's installed
  # dependencies, which pre-commit's isolated hook environments lack.
  # CI runs it (`uv run mypy te_platform`, .github/workflows/ci.yml).

#   Guide 2.1: the policy file must stay consistent with the code (every
#   tool and rule name resolves). Runs only when policy files or the
#   registry change, so most commits are not slowed down.
  - repo: local
    hooks:
      - id: policy-consistency
        name: tool policy consistency
        entry: uv run pytest tests/platform_tests/test_platform_policy.py -q
        # `unsupported` (pre-commit >= 4.4; formerly called `system`):
        # run a command already installed on your machine, here uv.
        language: unsupported
        pass_filenames: false
        files: ^(policy/|te_platform/registry/)
