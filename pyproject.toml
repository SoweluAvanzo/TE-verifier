[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-economy-verifier"
version = "0.1.0"
description = "Pre-deployment sustainability verifier for community token economies."
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.13",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
webapp = ["flask>=3.0"]

[project.scripts]
te-verify = "verifier.cli:main"
te-simulate = "verifier.abm.cli:main"

[tool.setuptools.packages.find]
include = ["schema*", "verifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
