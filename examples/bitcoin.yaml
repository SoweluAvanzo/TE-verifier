# Bitcoin — fixed-supply native protocol asset.
# Encoded against TE-IR v0.1 (schema/te_ir.py). Public parameters as of 2024.
meta:
  name: Bitcoin
  description: >-
    Native protocol asset of the Bitcoin network. Fixed terminal supply 21M,
    halving schedule, no protocol-level burn, off-chain BIP-driven governance.
  archetype: native_protocol_asset
  nfrs:
    resilience: 5
    adaptability: 1
    accessibility: 2
    transparency: 5
    proportionality: 5
    circulation_speed: retain_value
    governance_maturity: indefinite

tokens:
  - id: BTC
    function: [medium_of_exchange, store_of_value]
    value_anchor: none
    transferable: true
    holding_incentive_present: true
    offer_variety_K:
      min: 100
      max: 100000
    emission_rules:
      - trigger:
          kind: time_based
          event_predicate: per_block
        function:
          sign: decreasing_positive
          asymptotic_class:
            # Per-period rate (BTC/week) is bounded above by the current
            # block-subsidy schedule and decays geometrically across halvings.
            # Cumulative supply is capped at 21M (cumulative cap is implied
            # by the decreasing schedule and is not part of the rate class).
            family: constant
            parameter_ranges:
              c:
                min: 0
                max: 3500
    burn_rules: []  # no protocol-level burn
    initial_distribution:
      kind: none

participants:
  count_N:
    min: 10000000
    max: 100000000
  expected_Q:
    min: 1500000   # ~daily on-chain transactions × 7
    max: 3500000
  average_demand_d:
    min: 0.1
    max: 1.0
  growth_g:
    family: log
    parameter_ranges:
      a:
        min: 0.0
        max: 0.1
      b:
        min: 0.0
        max: 0.05
  topology: well_mixed
  agent_types:
    - id: hodler
      fraction: 0.7
      expected_holding_time:
        expected_periods:
          min: 50
          max: 200
      balance_share: 0.85
    - id: trader
      fraction: 0.25
      expected_holding_time:
        expected_periods:
          min: 1
          max: 8
      balance_share: 0.10
    - id: miner
      fraction: 0.05
      expected_holding_time:
        expected_periods:
          min: 1
          max: 4
      balance_share: 0.05

governance:
  type: hybrid
  rule_structure:
    protocol_change: committee     # de facto core dev coordination
    block_reward: not_adjustable
    mining_difficulty: smart_contract
    consensus_rules: committee
  monitoring_capacity_gamma:
    min: 0.95
    max: 1.0
  sanction_structure:
    kind: economic
    S_normalized:
      min: 0.7
      max: 0.9
  token_balance_gini:
    min: 0.6
    max: 0.85
